<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحويل إلى CRM الجديد...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0D1117 0%, #161B22 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .redirect-container {
            text-align: center;
            color: #ccd6f6;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .redirect-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #00E5FF, #00BCD4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            font-size: 18px;
            color: #a8b2d1;
            margin-bottom: 30px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            margin: 0 auto;
            border: 4px solid rgba(0, 229, 255, 0.2);
            border-top-color: #00E5FF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .features {
            margin-top: 30px;
            font-size: 14px;
            color: #8892b0;
        }

        .feature-item {
            display: inline-block;
            margin: 5px 15px;
        }

        .feature-item::before {
            content: '✓';
            color: #43e97b;
            margin-left: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <div class="redirect-icon">🚀</div>
        <h1>نظام CRM المتطور</h1>
        <p>جاري التحويل إلى الواجهة الجديدة...</p>
        <div class="spinner"></div>
        
        <div class="features">
            <div class="feature-item">Dark Theme احترافي</div>
            <div class="feature-item">Avatars متعددة ملونة</div>
            <div class="feature-item">6 أزرار إجراءات</div>
            <div class="feature-item">نظام التقييم بالنجوم</div>
            <div class="feature-item">WhatsApp Integration</div>
        </div>
    </div>

    <script>
        // تحويل تلقائي بعد ثانية واحدة
        setTimeout(() => {
            // التحويل مباشرة لصفحة Contacts - سوف تتحقق index.html من تسجيل الدخول تلقائياً
            window.location.href = '/index.html#contacts';
        }, 1000);
    </script>
</body>
</html>
