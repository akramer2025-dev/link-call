<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة العملاء CRM - Link Call</title>
    <link rel="icon" type="image/png" href="icon-512.png?v=3">
    <!-- SheetJS Library for Excel Import -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #667eea;
            --accent-color: #764ba2;
            --bg-dark: #0a1628;
            --bg-card: #1a1f2e;
            --bg-input: #1e2433;
            --text-primary: #ccd6f6;
            --text-secondary: #a8b2d1;
            --border-color: rgba(255, 255, 255, 0.08);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }
        
        .crm-container {
            max-width: 1800px;
            margin: 0 auto;
        }
        
        .crm-header {
            background: var(--bg-card);
            padding: 20px 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid var(--border-color);
        }
        
        .crm-title {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .crm-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .crm-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-back {
            background: linear-gradient(135deg, #5ec4d4, #1e88a8);
            color: white;
            text-decoration: none;
        }
        
        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(94, 196, 212, 0.4);
        }
        
        .btn-add {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            color: white;
        }
        
        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(67, 233, 123, 0.4);
        }
        
        .btn-import {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .btn-import:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-export {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: white;
        }
        
        .btn-export:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(251, 191, 36, 0.4);
        }
        
        /* Statistics Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
            border-color: rgba(102, 126, 234, 0.3);
        }
        
        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .stat-icon.blue { background: linear-gradient(135deg, #667eea, #764ba2); }
        .stat-icon.green { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        .stat-icon.orange { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
        .stat-icon.red { background: linear-gradient(135deg, #f56565, #c53030); }
        
        .stat-info h3 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 5px;
        }
        
        .stat-info p {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        /* Filters Section */
        .filters-section {
            background: var(--bg-card);
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 600;
        }
        
        .filter-select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
        }
        
        .filter-select:focus {
            outline: none;
            border-color: rgba(102, 126, 234, 0.6);
        }
        
        .search-section {
            background: var(--bg-card);
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }
        
        .search-box {
            position: relative;
        }
        
        .search-box input {
            width: 100%;
            padding: 12px 45px 12px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 14px;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: rgba(102, 126, 234, 0.6);
            background: #252b3d;
        }
        
        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.5;
        }
        
        .table-container {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        
        .contacts-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }
        
        .contacts-table thead {
            background: #252b3d;
            border-bottom: 2px solid rgba(102, 126, 234, 0.3);
        }
        
        .contacts-table th {
            padding: 15px 12px;
            text-align: right;
            font-weight: 700;
            font-size: 13px;
            color: var(--text-primary);
            white-space: nowrap;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .contacts-table th:last-child {
            border-right: none;
        }
        
        .contacts-table tbody tr {
            background: #1e2433;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        
        .contacts-table tbody tr:nth-child(even) {
            background: #1a1f2e;
        }
        
        .contacts-table tbody tr:hover {
            background: #252b3d;
            box-shadow: inset 0 0 0 1px rgba(102, 126, 234, 0.3);
        }
        
        .contacts-table td {
            padding: 12px;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .contacts-table td:last-child {
            border-right: none;
        }
        
        .contact-avatars-group {
            display: flex;
            gap: 6px;
        }
        
        .contact-avatar-multi {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: white;
            border: 2px solid var(--bg-card);
        }
        
        .avatar-gradient-1 { background: linear-gradient(135deg, #667eea, #764ba2); }
        .avatar-gradient-2 { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .avatar-gradient-3 { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .avatar-gradient-4 { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        .avatar-gradient-5 { background: linear-gradient(135deg, #fa709a, #fee140); }
        .avatar-gradient-6 { background: linear-gradient(135deg, #30cfd0, #330867); }
        .avatar-gradient-7 { background: linear-gradient(135deg, #a8edea, #fed6e3); }
        .avatar-gradient-8 { background: linear-gradient(135deg, #ff9a9e, #fecfef); }
        
        .contact-status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }
        
        .badge-premium { background: rgba(255, 215, 0, 0.2); color: #ffd700; border: 1px solid rgba(255, 215, 0, 0.3); }
        .badge-new { background: rgba(67, 233, 123, 0.2); color: #43e97b; border: 1px solid rgba(67, 233, 123, 0.3); }
        .badge-active { background: rgba(79, 172, 254, 0.2); color: #4facfe; border: 1px solid rgba(79, 172, 254, 0.3); }
        .badge-inactive { background: rgba(136, 146, 176, 0.2); color: #8892b0; border: 1px solid rgba(136, 146, 176, 0.3); }
        
        .table-action-btn {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
            margin-left: 4px;
        }
        
        .table-action-btn:hover {
            transform: translateY(-2px);
        }
        
        .whatsapp-btn { background: linear-gradient(135deg, #25D366, #128C7E); }
        .call-btn { background: linear-gradient(135deg, #4facfe, #00c6ff); }
        .edit-btn { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
        .delete-btn { background: linear-gradient(135deg, #f56565, #c53030); }
        
        .contact-rating .star {
            color: #ffc107;
            font-size: 14px;
        }
        
        .contact-rating .star.empty {
            color: transparent;
            -webkit-text-stroke: 1px #ffc107;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        
        .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        /* Sortable columns */
        .sortable {
            cursor: pointer;
            user-select: none;
            position: relative;
        }
        
        .sortable:hover {
            background: rgba(102, 126, 234, 0.1);
        }
        
        .sort-indicator {
            margin-right: 5px;
            font-size: 10px;
            color: #667eea;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .crm-header {
                flex-direction: column;
                align-items: stretch;
            }
            
            .crm-actions {
                width: 100%;
            }
            
            .crm-btn {
                flex: 1;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .filters-section {
                flex-direction: column;
            }
            
            .table-container {
                overflow-x: auto;
            }
            
            .contacts-table {
                min-width: 1200px;
            }
        }
        
        /* Progress Modal */
        .progress-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }
        
        .progress-content {
            background: #1a1f2e;
            padding: 40px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        
        .progress-icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .progress-bar-container {
            background: #1e2433;
            border-radius: 10px;
            height: 30px;
            margin: 20px 0;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            width: 0%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 14px;
        }
        
        .progress-text {
            color: var(--text-secondary);
            margin-top: 10px;
            font-size: 14px;
        }
        
        .progress-results {
            margin-top: 20px;
            padding: 15px;
            background: #1e2433;
            border-radius: 8px;
            font-size: 13px;
        }
        
        .progress-results div {
            margin: 5px 0;
        }
        
        .success-count { color: #43e97b; }
        .error-count { color: #f56565; }
        .duplicate-count { color: #fbbf24; }
    </style>
</head>
<body>
    <div class="crm-container">
        <div class="crm-header">
            <h1 class="crm-title">🎯 نظام إدارة العملاء CRM</h1>
            <div class="crm-actions">
                <a href="index.html" class="crm-btn btn-back">
                    ← العودة للصفحة الرئيسية
                </a>
                <button class="crm-btn btn-export" onclick="exportToExcel()">
                    📊 تصدير Excel
                </button>
                <button class="crm-btn btn-import" onclick="document.getElementById('excel-import-input').click()">
                    📥 استيراد Excel
                </button>
                <button class="crm-btn btn-add" onclick="showAddContactModal()">
                    + إضافة عميل جديد
                </button>
            </div>
        </div>
        
        <!-- Statistics Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon blue">👥</div>
                <div class="stat-info">
                    <h3 id="stat-total">0</h3>
                    <p>إجمالي العملاء</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green">🆕</div>
                <div class="stat-info">
                    <h3 id="stat-new">0</h3>
                    <p>عملاء جدد</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange">⭐</div>
                <div class="stat-info">
                    <h3 id="stat-premium">0</h3>
                    <p>عملاء مميزين</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon red">📞</div>
                <div class="stat-info">
                    <h3 id="stat-calls">0</h3>
                    <p>إجمالي المكالمات</p>
                </div>
            </div>
        </div>
        
        <!-- Filters -->
        <div class="filters-section">
            <span class="filter-label">فلترة حسب:</span>
            <select class="filter-select" id="filter-status" onchange="applyFilters()">
                <option value="">الحالة: الكل</option>
                <option value="premium">⭐ مميز</option>
                <option value="new">🆕 جديد</option>
                <option value="active">✓ نشط</option>
                <option value="inactive">○ غير نشط</option>
            </select>
            <select class="filter-select" id="filter-country" onchange="applyFilters()">
                <option value="">البلد: الكل</option>
            </select>
            <select class="filter-select" id="filter-rating" onchange="applyFilters()">
                <option value="">التقييم: الكل</option>
                <option value="5">5 نجوم</option>
                <option value="4">4 نجوم</option>
                <option value="3">3 نجوم</option>
                <option value="2">2 نجوم</option>
                <option value="1">1 نجمة</option>
            </select>
            <button class="crm-btn" onclick="resetFilters()" style="background:#1e2433;color:#a8b2d1;margin-right:auto;">
                🔄 إعادة تعيين
            </button>
        </div>
        
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="crm-search" placeholder="ابحث عن عميل (اسم، موبايل، بريد، بلد)...">
                <span class="search-icon">🔍</span>
            </div>
        </div>
        
        <div class="table-container" id="crm-table-container">
            <div class="empty-state">
                <div class="empty-icon">⏳</div>
                <p>جاري تحميل بيانات العملاء...</p>
            </div>
        </div>
    </div>
    
    <!-- Hidden File Input -->
    <input type="file" id="excel-import-input" accept=".xlsx,.xls,.csv" style="display:none;">
    
    <!-- Add Contact Modal -->
    <div id="add-contact-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:9999;align-items:center;justify-content:center;">
        <div style="background:#1a1f2e;padding:30px;border-radius:12px;width:90%;max-width:500px;border:1px solid rgba(255,255,255,0.1);">
            <h2 style="color:#ccd6f6;margin-bottom:20px;">➕ إضافة عميل جديد</h2>
            <div style="display:flex;flex-direction:column;gap:15px;">
                <input type="text" id="new-contact-name" placeholder="الاسم *" style="padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:#1e2433;color:#ccd6f6;">
                <input type="text" id="new-contact-phone" placeholder="رقم الموبايل *" style="padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:#1e2433;color:#ccd6f6;">
                <input type="email" id="new-contact-email" placeholder="البريد الإلكتروني" style="padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:#1e2433;color:#ccd6f6;">
                <input type="text" id="new-contact-country" placeholder="البلد" style="padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:#1e2433;color:#ccd6f6;">
                <input type="text" id="new-contact-balance" placeholder="الرصيد" style="padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:#1e2433;color:#ccd6f6;">
                <div style="display:flex;gap:10px;margin-top:10px;">
                    <button onclick="saveNewContact()" style="flex:1;padding:12px;border:none;border-radius:8px;background:linear-gradient(135deg,#43e97b,#38f9d7);color:white;font-weight:700;cursor:pointer;">
                        ✓ حفظ
                    </button>
                    <button onclick="hideAddContactModal()" style="flex:1;padding:12px;border:none;border-radius:8px;background:#1e2433;color:#a8b2d1;font-weight:700;cursor:pointer;">
                        ✕ إلغاء
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Progress Modal -->
    <div id="progress-modal" class="progress-modal">
        <div class="progress-content">
            <div class="progress-icon">📥</div>
            <h2 style="color:#ccd6f6;margin-bottom:20px;">استيراد من Excel</h2>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar">0%</div>
            </div>
            <div class="progress-text" id="progress-text">جاري التحضير...</div>
            <div class="progress-results" id="progress-results" style="display:none;"></div>
            <button onclick="closeProgressModal()" id="close-progress-btn" style="display:none;margin-top:20px;padding:12px 30px;border:none;border-radius:8px;background:linear-gradient(135deg,#667eea,#764ba2);color:white;font-weight:700;cursor:pointer;">
                إغلاق
            </button>
        </div>
    </div>
    
    <script>
        const API_BASE_URL = window.location.hostname === 'localhost' ? 'http://localhost:3000' : 'https://linkcall.akrammostafa.com';
        let _cachedContacts = [];
        let _allContacts = []; // For filtering
        let _currentSort = { column: null, direction: 'asc' };
        
        // Sort Table
        function sortTable(column) {
            if (_currentSort.column === column) {
                _currentSort.direction = _currentSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                _currentSort.column = column;
                _currentSort.direction = 'asc';
            }
            
            const sorted = [..._cachedContacts].sort((a, b) => {
                let valA, valB;
                
                switch(column) {
                    case 'name':
                        valA = (a.name || '').toLowerCase();
                        valB = (b.name || '').toLowerCase();
                        break;
                    case 'phone':
                        valA = a.phone || '';
                        valB = b.phone || '';
                        break;
                    case 'email':
                        valA = (a.email || '').toLowerCase();
                        valB = (b.email || '').toLowerCase();
                        break;
                    case 'country':
                        const notesA = a.notes || '';
                        const notesB = b.notes || '';
                        const countryA = notesA.match(/Country:\s*([^|]+)/);
                        const countryB = notesB.match(/Country:\s*([^|]+)/);
                        valA = countryA ? countryA[1].trim() : '';
                        valB = countryB ? countryB[1].trim() : '';
                        break;
                    case 'balance':
                        const balanceA = (a.notes || '').match(/Balance:\s*(.+)/);
                        const balanceB = (b.notes || '').match(/Balance:\s*(.+)/);
                        valA = balanceA ? parseFloat(balanceA[1].replace(/[^0-9.-]/g, '')) : 0;
                        valB = balanceB ? parseFloat(balanceB[1].replace(/[^0-9.-]/g, '')) : 0;
                        break;
                    case 'date':
                        valA = a.createdAt ? new Date(a.createdAt).getTime() : 0;
                        valB = b.createdAt ? new Date(b.createdAt).getTime() : 0;
                        break;
                    default:
                        return 0;
                }
                
                if (valA < valB) return _currentSort.direction === 'asc' ? -1 : 1;
                if (valA > valB) return _currentSort.direction === 'asc' ? 1 : -1;
                return 0;
            });
            
            _cachedContacts = sorted;
            renderTable(sorted);
        }
        
        // Update Statistics
        function updateStatistics() {
            const total = _allContacts.length;
            const newContacts = _allContacts.filter(c => c.tags?.includes('Excel Import') || !c.lastCallDate).length;
            const premium = _allContacts.filter(c => {
                const notes = c.notes || '';
                const balanceMatch = notes.match(/Balance:\s*(.+)/);
                const balance = balanceMatch ? parseFloat(balanceMatch[1].replace(/[^0-9.-]/g, '')) : 0;
                return c.tags?.includes('VIP') || balance > 1000;
            }).length;
            const totalCalls = _allContacts.reduce((sum, c) => sum + (c.totalCalls || 0), 0);
            
            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-new').textContent = newContacts;
            document.getElementById('stat-premium').textContent = premium;
            document.getElementById('stat-calls').textContent = totalCalls;
        }
        
        // Populate Country Filter
        function populateCountryFilter() {
            const countries = new Set();
            _allContacts.forEach(c => {
                const notes = c.notes || '';
                const countryMatch = notes.match(/Country:\s*([^|]+)/);
                if (countryMatch) {
                    countries.add(countryMatch[1].trim());
                }
            });
            
            const select = document.getElementById('filter-country');
            select.innerHTML = '<option value="">البلد: الكل</option>';
            [...countries].sort().forEach(country => {
                const option = document.createElement('option');
                option.value = country;
                option.textContent = country;
                select.appendChild(option);
            });
        }
        
        // Apply Filters
        function applyFilters() {
            const statusFilter = document.getElementById('filter-status').value;
            const countryFilter = document.getElementById('filter-country').value;
            const ratingFilter = document.getElementById('filter-rating').value;
            
            let filtered = [..._allContacts];
            
            // Status filter
            if (statusFilter) {
                filtered = filtered.filter(c => {
                    const notes = c.notes || '';
                    const balanceMatch = notes.match(/Balance:\s*(.+)/);
                    const balance = balanceMatch ? parseFloat(balanceMatch[1].replace(/[^0-9.-]/g, '')) : 0;
                    
                    const isNew = c.tags?.includes('Excel Import') || !c.lastCallDate;
                    const isPremium = c.tags?.includes('VIP') || balance > 1000;
                    const isActive = c.totalCalls > 0;
                    
                    if (statusFilter === 'premium') return isPremium;
                    if (statusFilter === 'new') return isNew;
                    if (statusFilter === 'active') return isActive;
                    if (statusFilter === 'inactive') return !isActive;
                    return true;
                });
            }
            
            // Country filter
            if (countryFilter) {
                filtered = filtered.filter(c => {
                    const notes = c.notes || '';
                    const countryMatch = notes.match(/Country:\s*([^|]+)/);
                    const country = countryMatch ? countryMatch[1].trim() : '';
                    return country === countryFilter;
                });
            }
            
            // Rating filter
            if (ratingFilter) {
                const targetRating = parseInt(ratingFilter);
                filtered = filtered.filter(c => {
                    const rating = c.rating || Math.floor(Math.random() * 3) + 3;
                    return rating >= targetRating;
                });
            }
            
            _cachedContacts = filtered;
            renderTable(filtered);
        }
        
        // Reset Filters
        function resetFilters() {
            document.getElementById('filter-status').value = '';
            document.getElementById('filter-country').value = '';
            document.getElementById('filter-rating').value = '';
            document.getElementById('crm-search').value = '';
            _cachedContacts = [..._allContacts];
            renderTable(_allContacts);
        }
        
        // Show/Hide Add Contact Modal
        function showAddContactModal() {
            document.getElementById('add-contact-modal').style.display = 'flex';
        }
        
        function hideAddContactModal() {
            document.getElementById('add-contact-modal').style.display = 'none';
            document.getElementById('new-contact-name').value = '';
            document.getElementById('new-contact-phone').value = '';
            document.getElementById('new-contact-email').value = '';
            document.getElementById('new-contact-country').value = '';
            document.getElementById('new-contact-balance').value = '';
        }
        
        // Save New Contact
        async function saveNewContact() {
            const name = document.getElementById('new-contact-name').value.trim();
            const phone = document.getElementById('new-contact-phone').value.trim();
            const email = document.getElementById('new-contact-email').value.trim();
            const country = document.getElementById('new-contact-country').value.trim();
            const balance = document.getElementById('new-contact-balance').value.trim();
            
            if (!name || !phone) {
                alert('⚠️ الاسم ورقم الموبايل مطلوبان!');
                return;
            }
            
            const companyId = sessionStorage.getItem('companyId') || localStorage.getItem('companyId');
            if (!companyId) {
                alert('⚠️ يجب تسجيل الدخول أولاً!');
                return;
            }
            
            const notes = `Country: ${country || '-'} | Balance: ${balance || '0'}`;
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/contacts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ companyId, name, phone, email, notes })
                });
                
                const result = await response.json();
                if (response.ok) {
                    alert('✅ تم إضافة العميل بنجاح!');
                    hideAddContactModal();
                    loadCRMContacts();
                } else {
                    alert('❌ خطأ: ' + result.message);
                }
            } catch (error) {
                console.error('Error adding contact:', error);
                alert('❌ حدث خطأ في إضافة العميل');
            }
        }
        
        // Export to Excel
        function exportToExcel() {
            if (_allContacts.length === 0) {
                alert('⚠️ لا توجد بيانات للتصدير!');
                return;
            }
            
            const data = _allContacts.map(c => {
                const notes = c.notes || '';
                const countryMatch = notes.match(/Country:\s*([^|]+)/);
                const balanceMatch = notes.match(/Balance:\s*(.+)/);
                
                return {
                    'الاسم': c.name || '',
                    'الموبايل': c.phone || '',
                    'البريد': c.email || '',
                    'البلد': countryMatch ? countryMatch[1].trim() : '',
                    'الرصيد': balanceMatch ? balanceMatch[1].trim() : '',
                    'عدد المكالمات': c.totalCalls || 0,
                    'تاريخ الإضافة': c.createdAt ? new Date(c.createdAt).toLocaleDateString('ar-EG') : ''
                };
            });
            
            const csv = [
                Object.keys(data[0]).join(','),
                ...data.map(row => Object.values(row).join(','))
            ].join('\n');
            
            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `CRM_Contacts_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
            
            alert('✅ تم تصدير ' + _allContacts.length + ' عميل إلى Excel!');
        }
        
        // Import from Excel Handler
        document.getElementById('excel-import-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            alert('📥 ميزة استيراد Excel قيد التطوير\n\nحالياً يمكنك استخدام صفحة Contacts الرئيسية للاستيراد');
            e.target.value = '';
        });
        
        // Premium CRM Contact Rendering
        function _renderContactItemCRM(contact, index) {
            const tr = document.createElement('tr');
            tr.className = 'contact-row';
            
            const cid = contact._id || contact.id || contact.contactId || '';
            const safeId = cid.toString().replace(/'/g, '');
            const safeName = (contact.name || '').replace(/'/g, '&#39;');
            const safePhone = (contact.phone || '').replace(/'/g, '');
            
            const notes = contact.notes || '';
            const countryMatch = notes.match(/Country:\s*([^|]+)/);
            const balanceMatch = notes.match(/Balance:\s*(.+)/);
            const country = countryMatch ? countryMatch[1].trim() : '-';
            const balance = balanceMatch ? balanceMatch[1].trim() : '-';
            
            const email = contact.email || '-';
            const createdDate = contact.createdAt ? new Date(contact.createdAt).toLocaleDateString('ar-EG') : '-';
            
            const nameWords = (contact.name || 'User').split(' ');
            const avatarColors = ['avatar-gradient-1', 'avatar-gradient-2', 'avatar-gradient-3', 'avatar-gradient-4'];
            const avatarsHTML = nameWords.slice(0, 3).map((word, i) => {
                const letter = word.charAt(0).toUpperCase();
                const colorClass = avatarColors[i % avatarColors.length];
                return `<div class="contact-avatar-multi ${colorClass}">${letter}</div>`;
            }).join('');
            
            const isNew = contact.tags?.includes('Excel Import') || !contact.lastCallDate;
            const isPremium = contact.tags?.includes('VIP') || parseFloat(balance.replace(/[^0-9.-]/g, '')) > 1000;
            const isActive = contact.totalCalls > 0;
            
            let statusBadge = '';
            if (isPremium) {
                statusBadge = '<span class="contact-status-badge badge-premium">⭐ مميز</span>';
            } else if (isNew) {
                statusBadge = '<span class="contact-status-badge badge-new">🆕 جديد</span>';
            } else if (isActive) {
                statusBadge = '<span class="contact-status-badge badge-active">✓ نشط</span>';
            } else {
                statusBadge = '<span class="contact-status-badge badge-inactive">○ غير نشط</span>';
            }
            
            const rating = contact.rating || Math.floor(Math.random() * 3) + 3;
            const starsHTML = Array(5).fill(0).map((_, i) => 
                `<span class="star ${i < rating ? '' : 'empty'}">★</span>`
            ).join('');
            
            tr.innerHTML = `
                <td style="text-align:center;font-weight:700;color:#8892b0;">${index + 1}</td>
                <td>
                    <div class="contact-avatars-group">${avatarsHTML}</div>
                </td>
                <td>
                    <div style="font-weight:600;color:#ccd6f6;">${contact.name || ''}</div>
                    <div style="font-size:11px;margin-top:2px;">${statusBadge}</div>
                </td>
                <td style="direction:ltr;text-align:right;font-family:monospace;">${contact.phone || ''}</td>
                <td>${email}</td>
                <td>${country}</td>
                <td style="color:#1dd1a1;font-weight:700;">${balance}</td>
                <td>
                    <div class="contact-rating">${starsHTML}</div>
                </td>
                <td style="font-size:12px;color:#8892b0;">${createdDate}</td>
                <td style="text-align:center;">
                    <button class="table-action-btn whatsapp-btn" onclick="openWhatsApp('${safePhone}')" title="واتساب">💬</button>
                    <button class="table-action-btn call-btn" onclick="openCallPage('${safePhone}')" title="اتصال">📞</button>
                    <button class="table-action-btn edit-btn" onclick="editContact('${safeId}')" title="تعديل">✏️</button>
                    <button class="table-action-btn delete-btn" onclick="deleteContact('${safeId}', '${safeName}')" title="حذف">🗑️</button>
                </td>
            `;
            
            return tr;
        }
        
        // Render Table
        function renderTable(contacts) {
            const container = document.getElementById('crm-table-container');
            
            if (contacts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <p>لا توجد نتائج</p>
                    </div>
                `;
                return;
            }
            
            const getSortIcon = (column) => {
                if (_currentSort.column !== column) return '⬍';
                return _currentSort.direction === 'asc' ? '▲' : '▼';
            };
            
            const table = document.createElement('table');
            table.className = 'contacts-table';
            table.innerHTML = `
                <thead>
                    <tr>
                        <th style="width:50px;">#</th>
                        <th style="width:120px;">الصورة</th>
                        <th class="sortable" onclick="sortTable('name')">
                            الاسم <span class="sort-indicator">${getSortIcon('name')}</span>
                        </th>
                        <th style="width:140px;">الموبايل</th>
                        <th class="sortable" onclick="sortTable('email')" style="width:180px;">
                            البريد <span class="sort-indicator">${getSortIcon('email')}</span>
                        </th>
                        <th class="sortable" onclick="sortTable('country')" style="width:100px;">
                            البلد <span class="sort-indicator">${getSortIcon('country')}</span>
                        </th>
                        <th class="sortable" onclick="sortTable('balance')" style="width:100px;">
                            الرصيد <span class="sort-indicator">${getSortIcon('balance')}</span>
                        </th>
                        <th style="width:120px;">التقييم</th>
                        <th class="sortable" onclick="sortTable('date')" style="width:120px;">
                            التاريخ <span class="sort-indicator">${getSortIcon('date')}</span>
                        </th>
                        <th style="width:180px;">الإجراءات</th>
                    </tr>
                </thead>
                <tbody></tbody>
            `;
            
            const tbody = table.querySelector('tbody');
            contacts.forEach((contact, index) => tbody.appendChild(_renderContactItemCRM(contact, index)));
            
            container.innerHTML = '';
            container.appendChild(table);
        }
        
        async function loadCRMContacts() {
            const container = document.getElementById('crm-table-container');
            const companyId = sessionStorage.getItem('companyId') || localStorage.getItem('companyId');
            
            if (!companyId) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔒</div>
                        <p>يجب تسجيل الدخول أولاً</p>
                        <a href="login.html" class="crm-btn btn-back" style="display:inline-block;margin-top:20px;">تسجيل الدخول</a>
                    </div>
                `;
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/contacts?companyId=${encodeURIComponent(companyId)}`);
                const data = await response.json();
                const contacts = data.contacts || [];
                
                _allContacts = contacts;
                _cachedContacts = contacts;
                
                // Update statistics
                updateStatistics();
                
                // Populate filters
                populateCountryFilter();
                
                if (contacts.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">👥</div>
                            <p>لا توجد جهات اتصال</p>
                            <button class="crm-btn btn-add" onclick="showAddContactModal()" style="margin-top:20px;">
                                + إضافة عميل جديد
                            </button>
                        </div>
                    `;
                    return;
                }
                
                renderTable(contacts);
                
                console.log('✅ تم تحميل', contacts.length, 'عميل في CRM');
            } catch (error) {
                console.error('خطأ في تحميل البيانات:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <p>خطأ في تحميل البيانات</p>
                    </div>
                `;
            }
        }
        
        function openWhatsApp(phone) {
            const cleanPhone = phone.replace(/[^0-9+]/g, '');
            window.open(`https://wa.me/${cleanPhone}`, '_blank');
        }
        
        function openCallPage(phone) {
            window.location.href = `index.html?call=${encodeURIComponent(phone)}`;
        }
        
        function editContact(contactId) {
            alert('تعديل العميل: ' + contactId + '\n\nهذه الميزة قيد التطوير');
        }
        
        function deleteContact(contactId, name) {
            if (confirm(`هل تريد حذف العميل: ${name}؟`)) {
                alert('ميزة الحذف قيد التطوير');
            }
        }
        
        // Search functionality
        document.getElementById('crm-search').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (!query) {
                applyFilters(); // Reapply existing filters
                return;
            }
            
            const filtered = _cachedContacts.filter(c => 
                (c.name || '').toLowerCase().includes(query) ||
                (c.phone || '').includes(query) ||
                (c.email || '').toLowerCase().includes(query) ||
                (c.notes || '').toLowerCase().includes(query)
            );
            
            renderTable(filtered);
        });
        
        // Close Progress Modal
        function closeProgressModal() {
            document.getElementById('progress-modal').style.display = 'none';
            loadCRMContacts(); // Reload contacts after import
        }
        
        // Excel Import Handler
        document.getElementById('excel-import-input').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const companyId = sessionStorage.getItem('companyId') || localStorage.getItem('companyId');
            if (!companyId) {
                alert('⚠️ يجب تسجيل الدخول أولاً');
                return;
            }
            
            // Show progress modal
            const modal = document.getElementById('progress-modal');
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');
            const progressResults = document.getElementById('progress-results');
            const closeBtn = document.getElementById('close-progress-btn');
            
            modal.style.display = 'flex';
            progressBar.style.width = '0%';
            progressBar.textContent = '0%';
            progressText.textContent = 'جاري قراءة الملف...';
            progressResults.style.display = 'none';
            closeBtn.style.display = 'none';
            
            try {
                // Read file
                const reader = new FileReader();
                
                reader.onload = async function(e) {
                    try {
                        progressText.textContent = 'جاري تحليل البيانات...';
                        
                        // Parse Excel file
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, {type: 'array'});
                        
                        // Get first sheet
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(firstSheet);
                        
                        if (rows.length === 0) {
                            alert('⚠️ الملف فارغ أو لا يحتوي على بيانات صحيحة');
                            modal.style.display = 'none';
                            return;
                        }
                        
                        progressText.textContent = `تم العثور على ${rows.length} صف. جاري الاستيراد...`;
                        
                        // Extract contacts from rows
                        const contacts = [];
                        for (const row of rows) {
                            // Try different column name variations
                            const name = row['الاسم'] || row['Name'] || row['name'] || row['الأسم'] || row['اسم'] || '';
                            const phone = row['الموبايل'] || row['Phone'] || row['phone'] || row['الهاتف'] || row['رقم الموبايل'] || row['Mobile'] || '';
                            const email = row['البريد'] || row['Email'] || row['email'] || row['البريد الإلكتروني'] || '';
                            const country = row['البلد'] || row['Country'] || row['country'] || row['الدولة'] || '';
                            const balance = row['الرصيد'] || row['Balance'] || row['balance'] || '';
                            
                            // Validate: need at least name and phone
                            if (name && phone) {
                                contacts.push({ name, phone, email, country, balance });
                            }
                        }
                        
                        if (contacts.length === 0) {
                            alert('⚠️ لم يتم العثور على جهات اتصال صالحة (تحتاج على الأقل اسم ورقم موبايل)');
                            modal.style.display = 'none';
                            return;
                        }
                        
                        // Get existing contacts for duplicate detection
                        const existingResponse = await fetch(`${API_BASE_URL}/api/contacts?companyId=${encodeURIComponent(companyId)}`);
                        const existingData = await existingResponse.json();
                        const existingPhones = new Set((existingData.contacts || []).map(c => c.phone?.replace(/[^0-9]/g, '')));
                        
                        // Import in batches of 50
                        let successCount = 0;
                        let errorCount = 0;
                        let duplicateCount = 0;
                        const batchSize = 50;
                        
                        for (let i = 0; i < contacts.length; i += batchSize) {
                            const batch = contacts.slice(i, i + batchSize);
                            
                            for (const contact of batch) {
                                try {
                                    // Check for duplicate
                                    const cleanPhone = contact.phone.replace(/[^0-9]/g, '');
                                    if (existingPhones.has(cleanPhone)) {
                                        duplicateCount++;
                                        continue;
                                    }
                                    
                                    // Build notes
                                    const notes = `Country: ${contact.country || '-'} | Balance: ${contact.balance || '0'} | Source: Excel Import`;
                                    
                                    // Add contact
                                    const response = await fetch(`${API_BASE_URL}/api/contacts`, {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({
                                            companyId,
                                            name: contact.name,
                                            phone: contact.phone,
                                            email: contact.email || '',
                                            notes: notes,
                                            tags: ['Excel Import']
                                        })
                                    });
                                    
                                    if (response.ok) {
                                        successCount++;
                                        existingPhones.add(cleanPhone); // Add to set to prevent duplicates in same batch
                                    } else {
                                        errorCount++;
                                    }
                                } catch (err) {
                                    console.error('خطأ في إضافة جهة اتصال:', err);
                                    errorCount++;
                                }
                            }
                            
                            // Update progress
                            const progress = Math.min(100, Math.round(((i + batch.length) / contacts.length) * 100));
                            progressBar.style.width = `${progress}%`;
                            progressBar.textContent = `${progress}%`;
                            progressText.textContent = `تمت معالجة ${i + batch.length} من ${contacts.length}...`;
                            
                            // Small delay between batches
                            await new Promise(resolve => setTimeout(resolve, 100));
                        }
                        
                        // Show results
                        progressBar.style.width = '100%';
                        progressBar.textContent = '100%';
                        progressText.textContent = '✅ اكتمل الاستيراد!';
                        progressResults.innerHTML = `
                            <div class="success-count">✓ تم الإضافة بنجاح: ${successCount}</div>
                            <div class="duplicate-count">⚠ مكرر (تم التجاهل): ${duplicateCount}</div>
                            <div class="error-count">✗ فشل: ${errorCount}</div>
                            <div style="color:#ccd6f6;margin-top:10px;font-weight:700;">
                                إجمالي: ${contacts.length} جهة اتصال
                            </div>
                        `;
                        progressResults.style.display = 'block';
                        closeBtn.style.display = 'block';
                        
                    } catch (parseError) {
                        console.error('خطأ في معالجة الملف:', parseError);
                        progressText.textContent = '❌ خطأ في معالجة الملف';
                        progressResults.innerHTML = `
                            <div class="error-count">فشل في قراءة الملف. تأكد أن الملف بصيغة Excel صحيحة (.xlsx أو .xls)</div>
                        `;
                        progressResults.style.display = 'block';
                        closeBtn.style.display = 'block';
                    }
                };
                
                reader.onerror = function() {
                    alert('❌ خطأ في قراءة الملف');
                    modal.style.display = 'none';
                };
                
                reader.readAsArrayBuffer(file);
                
            } catch (error) {
                console.error('خطأ في استيراد Excel:', error);
                alert('❌ حدث خطأ أثناء الاستيراد');
                modal.style.display = 'none';
            }
            
            // Reset file input
            e.target.value = '';
        });
        
        // Load contacts on page load
        window.addEventListener('DOMContentLoaded', loadCRMContacts);
    </script>
