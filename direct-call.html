<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Call - „ﬂ«·„… „»«‘—…</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #5ec4d4 0%, #1e3a5f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            direction: rtl;
        }
        
        .redirect-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
        }
        
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        h1 {
            color: #333;
            margin-bottom: 15px;
            font-size: 24px;
        }
        
        .phone-number {
            font-size: 28px;
            color: #5ec4d4;
            font-weight: bold;
            margin: 20px 0;
            direction: ltr;
        }
        
        .loading {
            margin: 20px 0;
        }
        
        .loading-bar {
            width: 100%;
            height: 4px;
            background: #f0f0f0;
            border-radius: 2px;
            overflow: hidden;
        }
        
        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #5ec4d4, #1e3a5f);
            animation: loading 1.5s infinite;
        }
        
        @keyframes loading {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
        
        .message {
            color: #666;
            font-size: 16px;
            margin-top: 15px;
        }
        
        .error {
            color: #e74c3c;
            margin-top: 20px;
            padding: 15px;
            background: #fee;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <div class="icon">??</div>
        <h1>Link Call</h1>
        <div class="phone-number" id="phone-display">Ã«—Ì «· Õ„Ì·...</div>
        <div class="loading">
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
        </div>
        <div class="message">Ã«—Ì  Õ÷Ì— «·„ﬂ«·„…...</div>
        <div class="error" id="error-message"></div>
    </div>

    <script>
        // «·Õ’Ê· ⁄·Ï „⁄«„·«  URL
        const urlParams = new URLSearchParams(window.location.search);
        const phoneNumber = urlParams.get('phone') || urlParams.get('number');
        const employeeId = urlParams.get('employeeId');
        const employeeName = urlParams.get('employeeName');
        
        const phoneDisplay = document.getElementById('phone-display');
        const errorMessage = document.getElementById('error-message');
        
        // «· Õﬁﬁ „‰ ÊÃÊœ —ﬁ„ «·Â« ›
        if (!phoneNumber) {
            errorMessage.textContent = 'Œÿ√: ·„ Ì „  Ê›Ì— —ﬁ„ «·Â« ›';
            errorMessage.style.display = 'block';
            phoneDisplay.textContent = '—ﬁ„ €Ì— „ Ê›—';
        } else {
            phoneDisplay.textContent = phoneNumber;
            
            //  ”ÃÌ· œŒÊ·  ·ﬁ«∆Ì Ê ÃÂÌ“ «·Ã·”…
            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('username', 'crm_user');
            sessionStorage.setItem('userRole', 'crm');
            sessionStorage.setItem('fullname', '„” Œœ„ CRM');
            sessionStorage.setItem('canViewRecordings', 'false');
            
            // Õ›Ÿ »Ì«‰«  «·„ÊŸ› ≈–« ﬂ«‰  „ÊÃÊœ…
            if (employeeId) {
                localStorage.setItem('employeeId', employeeId);
                sessionStorage.setItem('employeeId', employeeId);
            }
            if (employeeName) {
                localStorage.setItem('employeeName', employeeName);
                sessionStorage.setItem('fullname', employeeName);
            }
            
            // ≈⁄«œ… «· ÊÃÌÂ ≈·Ï «·’›Õ… «·—∆Ì”Ì… „⁄ —ﬁ„ «·Â« ›
            setTimeout(() => {
                const redirectUrl = `index.html?autoLogin=true&phone=${encodeURIComponent(phoneNumber)}` +
                    (employeeId ? `&employeeId=${encodeURIComponent(employeeId)}` : '') +
                    (employeeName ? `&employeeName=${encodeURIComponent(employeeName)}` : '');
                
                window.location.href = redirectUrl;
            }, 1000);
        }
    </script>
</body>
</html>
