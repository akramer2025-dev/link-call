<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل الدخول - Link Call</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📞</text></svg>">
    
    <!-- PWA Configuration -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1a365d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Link Call">
    <link rel="apple-touch-icon" href="/icon-192.png">
    
    <link rel="stylesheet" href="login-style.css?v=2">
</head>
<body>
    <!-- خلفية سلايدر الكول سنتر -->
    <div class="slider-container">
        <div class="slide active" style="background-image: url('https://images.unsplash.com/photo-1521791136064-7986c2920216?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');"></div>
        <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1560264280-88b68371db39?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');"></div>
        <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1587560699334-cc4ff634909a?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');"></div>
        <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1553877522-43269d4ea984?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');"></div>
        <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1573164713714-d95e436ab8d6?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');"></div>
    </div>
    <div class="background-overlay"></div>
    
    <!-- الحاوية الرئيسية -->
    <div class="login-wrapper">
        <!-- القسم الأيسر - معلومات -->
        <div class="info-section">
            <div class="info-content">
                <img src="icon-512.png?v=2" alt="Link Call" class="brand-logo">
                <h1 class="brand-title">Link Call</h1>
                <p class="brand-subtitle">نظام المكالمات السحابي المتكامل</p>
                
                <div class="features-list">
                    <div class="feature-item">
                        <span class="feature-icon">📞</span>
                        <span class="feature-text">مكالمات عالية الجودة</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">🌍</span>
                        <span class="feature-text">اتصل من أي مكان في العالم</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">🔒</span>
                        <span class="feature-text">تشفير وحماية كاملة</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">📊</span>
                        <span class="feature-text">تقارير وإحصائيات مفصلة</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- القسم الأيمن - نموذج الدخول -->
        <div class="login-section">
            <div class="login-card">
                <div class="login-header">
                    <h2>مرحباً بك</h2>
                    <p>سجل دخولك للمتابعة</p>
                </div>
                
                <form id="login-form">
                    <div class="form-group">
                        <label for="username">اسم المستخدم</label>
                        <div class="input-wrapper">
                            <span class="input-icon">👤</span>
                            <input type="text" id="username" name="username" placeholder="أدخل اسم المستخدم" required autocomplete="username">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">كلمة المرور</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
                            <button type="button" class="toggle-password" id="toggle-password">👁️</button>
                        </div>
                    </div>
                    
                    <div class="error-message hidden" id="error-message">
                        ⚠️ اسم المستخدم أو كلمة المرور غير صحيحة
                    </div>
                    
                    <button type="submit" class="login-btn" id="login-btn">
                        <span class="btn-text">تسجيل الدخول</span>
                        <span class="btn-loader hidden"></span>
                    </button>
                </form>
                
                <div class="login-footer">
                    <p>© 2025 ENG/AKRAM ELMASRY</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // معالجة تسجيل الدخول
        const loginForm = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');
        const togglePassword = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('login-btn');
        
        // بيانات المطور الأساسية
        const adminUsername = 'akram';
        const adminPassword = 'Aazxc';
        
        // إظهار/إخفاء كلمة المرور
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.textContent = type === 'password' ? '👁️' : '🙈';
        });
        
        // إظهار حالة التحميل
        function showLoading() {
            loginBtn.classList.add('loading');
            loginBtn.querySelector('.btn-text').textContent = 'جاري التحقق...';
        }
        
        // إخفاء حالة التحميل
        function hideLoading() {
            loginBtn.classList.remove('loading');
            loginBtn.querySelector('.btn-text').textContent = 'تسجيل الدخول';
        }
        
        // معالجة النموذج
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.classList.add('hidden');
            showLoading();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            
            // تحديد المطور الرئيسي
            if (username === adminUsername && password === adminPassword) {
                // حفظ بيانات المطور
                sessionStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('username', username);
                sessionStorage.setItem('userRole', 'admin');
                sessionStorage.setItem('fullname', 'المطور الرئيسي');
                sessionStorage.setItem('canViewRecordings', 'true');
                localStorage.setItem('employeeId', 'admin');
                localStorage.setItem('employeeName', 'المطور الرئيسي');
                
                // تسجيل وقت دخول المطور
                try {
                    const baseUrl = window.location.origin;
                    await fetch(`${baseUrl}/work-tracking`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'login',
                            employeeId: 'admin',
                            employeeName: 'المطور الرئيسي'
                        })
                    });
                } catch (error) {
                    console.error('خطأ في تسجيل وقت الدخول:', error);
                }
                
                loginBtn.classList.add('success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 500);
                return;
            }
            
            // محاولة تسجيل دخول مدير
            try {
                const baseUrl = window.location.origin;
                const response = await fetch(`${baseUrl}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    // حفظ بيانات المدير
                    sessionStorage.setItem('isLoggedIn', 'true');
                    sessionStorage.setItem('username', data.employee.username);
                    
                    const userRole = data.employee.isTrial ? 'trial' : (data.employee.role || 'employee');
                    sessionStorage.setItem('userRole', userRole);
                    
                    if (data.employee.isTrial) {
                        sessionStorage.setItem('isTrial', 'true');
                        sessionStorage.setItem('maxCalls', data.employee.maxCalls || '2');
                    }
                    
                    sessionStorage.setItem('fullname', data.employee.name);
                    sessionStorage.setItem('departmentName', data.employee.departmentName);
                    sessionStorage.setItem('employeeId', data.employee.id.toString());
                    localStorage.setItem('employeeId', data.employee.id.toString());
                    localStorage.setItem('employeeName', data.employee.name);
                    
                    const permissions = data.employee.permissions || {};
                    sessionStorage.setItem('permissions', JSON.stringify(permissions));
                    sessionStorage.setItem('canViewOwnRecordings', permissions.viewOwnRecordings ? 'true' : 'false');
                    sessionStorage.setItem('canViewAllRecordings', permissions.viewAllRecordings ? 'true' : 'false');
                    sessionStorage.setItem('canDeleteRecordings', permissions.deleteRecordings ? 'true' : 'false');
                    sessionStorage.setItem('canEditProfile', permissions.editProfile ? 'true' : 'false');
                    sessionStorage.setItem('canCallFromUSA', permissions.callFromUSA !== false ? 'true' : 'false');
                    sessionStorage.setItem('canCallFromEgypt', permissions.callFromEgypt ? 'true' : 'false');
                    sessionStorage.setItem('canCallFromSaudi', permissions.callFromSaudi ? 'true' : 'false');
                    
                    // تسجيل وقت الدخول
                    await fetch(`${baseUrl}/work-tracking`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'login',
                            employeeId: data.employee.id.toString(),
                            employeeName: data.employee.name
                        })
                    });
                    
                    loginBtn.classList.add('success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 500);
                } else {
                    hideLoading();
                    errorMessage.textContent = '⚠️ ' + (data.error || 'اسم المستخدم أو كلمة المرور غير صحيحة');
                    errorMessage.classList.remove('hidden');
                    loginForm.classList.add('shake');
                    setTimeout(() => loginForm.classList.remove('shake'), 500);
                }
            } catch (error) {
                hideLoading();
                console.error('❌ خطأ في تسجيل الدخول:', error);
                errorMessage.textContent = '⚠️ خطأ في الاتصال بالخادم';
                errorMessage.classList.remove('hidden');
                loginForm.classList.add('shake');
                setTimeout(() => loginForm.classList.remove('shake'), 500);
            }
        });
        
        // سلايدر الخلفية
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const totalSlides = slides.length;
        
        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % totalSlides;
            slides[currentSlide].classList.add('active');
        }
        
        // تغيير الصورة كل 5 ثواني
        setInterval(nextSlide, 5000);
    </script>
</body>
</html>
